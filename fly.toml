# fly.toml for forex-radar — scheduler + API server
app = 'forex-radar'
primary_region = 'ams'

[build]

[deploy]
  strategy = 'immediate'

[env]
  DB_PATH = '/data/forex_radar.db'

[[mounts]]
  source = 'forex_radar_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1
  processes = ['app']

  # Count requests in progress, not open connections: browsers and TradingView keep
  # connections open, and ~50 webhooks arrive together at every 4H close. With a
  # 25-connection cap they queued at Fly's proxy and TradingView timed out (2026-10-24).
  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
